# Python の道具の依存と版（uv で動かす）。Python のパッケージとしては配らない（package = false）
#   uv run --locked --group audio python scripts/mix.py <動画…>   # 音のミックス（npm run mix は、選んだ動画をここに渡す）
#   uv run --locked --group audio python scripts/build_music.py   # BGM・効果音（npm run build:music）
# audio の版を変えると BGM・効果音のバイト列が変わりうる。上げたら npm run music:verify で素材の SHA256SUMS と比べる
# Kokoro（scripts/tts_kokoro.py）と Whisper（scripts/check_speech.py）は、スクリプトの頭の依存と <スクリプト>.py.lock で固定する
[project]
name = "chalkfile"
version = "1.0.0"
description = "Chalkfile の音の道具（BGM・効果音の合成と、音のミックス）"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
audio = ["numpy==2.5.4", "scipy==1.18.1"]

[tool.uv]
package = false
required-version = ">=0.9"
