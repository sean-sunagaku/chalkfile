# ffmpeg と ffprobe を、版を固定した静的なビルドから入れる（毎回 apt で入れない。apt の版の変わり目に左右されない）。
# ffprobe は、書き出した動画を確かめるのに使う（scripts/stages/video/render.ts。render-check.yml）。
# 出どころ: BtbN/FFmpeg-Builds の GitHub Releases（ffmpeg.org の Download のページの「Linux Static Builds」が案内している静的ビルド）。
#   月の最後のビルドは 2 年残る（BtbN/FFmpeg-Builds の README の「Release Retention Policy」）。ここでは 2026-10 の最後のビルドを使う
#   ffmpeg n8.1.3（8.1 の枝）の linux64・gpl。tar.xz の sha256 は、Releases の checksums.sha256 と、GitHub が出す asset の digest で
#   同じ値を確かめた（2026-11-03）。取り出した bin/ffmpeg と bin/ffprobe の sha256 も書いておき（ffprobe は 2026-11-04 に、同じ tar.xz から
#   取り出して測った）、キャッシュから戻したものも毎回確かめる
# 版を上げるとき: 新しい月の最後のビルドの URL・tar.xz の sha256・中の bin/ffmpeg と bin/ffprobe のパスと sha256・キャッシュの鍵を書き換える。
#   素材の WAV が SHA256SUMS と同じバイトになるか（bun scripts/materials.ts pull が確かめる）で、FLAC を戻した結果が変わらないかが分かる
name: ffmpeg
description: 版を固定した ffmpeg と ffprobe（静的なビルド）を、sha256 を確かめてから PATH に足す
runs:
  using: composite
  steps:
    - name: ffmpeg を使える runner か
      if: runner.os != 'Linux' || runner.arch != 'X64'
      shell: bash
      run: |
        echo '固定した ffmpeg は Linux の x64 だけ（.github/actions/ffmpeg/action.yml）' >&2
        exit 1
    - name: ffmpeg のキャッシュ
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/chalkfile/ffmpeg
        # 鍵は、中の 2 つの実行ファイルの sha256（ffprobe を足したときに、ffmpeg だけのキャッシュを戻さないように変えた）
        key: ffmpeg-ffprobe-Linux-X64-6ad8e7b802374502e927fdcf6de8019f4f24cac3c80fbfe3b41eda6f08648b55-8c638116ac7d084ad516656e8e2541c888339a93538b8759ddcd4d766aad1601
    - name: ffmpeg を取る
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
        ARCHIVE_SHA256: 41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
        MEMBER: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1/bin/ffmpeg
        PROBE_MEMBER: ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1/bin/ffprobe
      run: |
        archive="$RUNNER_TEMP/ffmpeg.tar.xz"
        curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$URL"
        echo "$ARCHIVE_SHA256  $archive" | sha256sum -c -
        mkdir -p ~/.cache/chalkfile/ffmpeg
        tar -xJf "$archive" -C ~/.cache/chalkfile/ffmpeg --strip-components=2 "$MEMBER" "$PROBE_MEMBER"
        rm -f "$archive"
    - name: ffmpeg と ffprobe を確かめて PATH に足す
      shell: bash
      env:
        BINARY_SHA256: 6ad8e7b802374502e927fdcf6de8019f4f24cac3c80fbfe3b41eda6f08648b55
        PROBE_SHA256: 8c638116ac7d084ad516656e8e2541c888339a93538b8759ddcd4d766aad1601
      run: |
        dir=~/.cache/chalkfile/ffmpeg
        echo "$BINARY_SHA256  $dir/ffmpeg" | sha256sum -c -
        echo "$PROBE_SHA256  $dir/ffprobe" | sha256sum -c -
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/ffmpeg" -hide_banner -version | head -n 1
        "$dir/ffprobe" -hide_banner -version | head -n 1
