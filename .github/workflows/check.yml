# 型・台本とファイルの点検（AI への指示文・HTML・見えない文字・秘密情報）を、Pull Request と main への push で流す
name: check

on:
  pull_request:
  push:
    branches: [main]

# 読み取りだけ。秘密情報は使わない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # 依存のインストール時スクリプトは動かさない
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: bun scripts/check_content.ts --self-test
      - run: bun scripts/check_content.ts
