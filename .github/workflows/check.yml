# lint・型・台本とファイルの点検（AI への指示文・HTML・見えない文字・秘密情報）と、公開と同じ手順のサイトの組み立て（build）を、
# Pull Request と main への push で流す。公開（deploy.yml）で初めて止まっていたこと（ポスターの入れ忘れなど）を、マージの前に見つける
name: check

on:
  pull_request:
  push:
    branches: [main]

# 読み取りだけ。秘密情報は使わない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 足したファイルの整形を見るため、マージの commit の 1 つ目の親（base の先頭）まで取る
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # package.json に packageManager を書くと npm のキャッシュが自動で入る。キャッシュは鍵と範囲を決めてから足すので、今は入れない
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # 依存のインストール時スクリプトは動かさない
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # 全体の整形は、開いている講座の PR が 0 の日に 1 回で行う。それまでは、足したファイルだけを整った形で入れる
      - name: 足したファイルの整形
        if: github.event_name == 'pull_request'
        run: bun scripts/format_new.ts --base HEAD^1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # uv の版は pyproject.toml の required-version から決まる。キャッシュは鍵と範囲を決めてから足すので、今は入れない
          enable-cache: false
      # ruff の版は package.json の lint:py で固定している
      - name: Python の lint（ruff）
        env:
          RUFF_OUTPUT_FORMAT: github
        run: npm run lint:py
      # render.sh の SC2086（3 件）は #30 が直している。#30 が入ったら package.json の lint:sh の --exclude=SC2086 を外す
      - name: シェルの lint（shellcheck）
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }
          shellcheck --version
          npm run lint:sh
      # 使っていないファイル・export・依存の一覧。はじめは止めない（ログに出すだけ。講座の PR に注釈を出さない）。
      # 一覧を空にしたら continue-on-error を外す
      - name: 使っていないコード（knip）
        continue-on-error: true
        run: npm run knip
      - run: npm run typecheck
      - run: npm test
      # 台本と、公開で止まること（講座サイトの設定・ID・リンク、教材の参照、公開する言語のポスターと動画の一覧）
      - run: npm run validate
      - run: bun scripts/check_content.ts --self-test
      - run: bun scripts/check_content.ts
      # 文書のリンク・アンカー・スキルの説明の長さは止める。古い言葉・一覧の食い違い・生成物の印・使い方は、今は注意だけ
      # （片付けたら --strict にする）
      - run: npm run check:docs

  # 公開（deploy.yml）と同じ手順で、サイトを組み立てて点検する。公開はしない。秘密情報は使わず、GITHUB_TOKEN は読み取りだけ
  # （上の permissions: contents: read）。声の合成も動画の書き出しもせず、素材と動画の一覧が足りなければ止まる
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # package.json に packageManager を書くと npm のキャッシュが自動で入る。キャッシュは鍵と範囲を決めてから足すので、今は入れない
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # 依存のインストール時スクリプトは動かさない
      - run: npm ci --ignore-scripts
      # 素材の FLAC を WAV に戻すのに使う（キャッシュは T1-13 で足す）
      - name: 素材の可逆音声を復元する ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # 素材のブランチ（公開のリポジトリ）から台詞の音声を取り出し、合成せずに時刻とサイトのデータを作る
      - name: 素材と講義データ
        run: |
          bun scripts/materials.ts pull
          bun scripts/synth.ts --cached-only
      # 動画の一覧の項目が Releases にあり、大きさと SHA-256 が合うか（公開の Releases を読むだけ）
      - name: 動画を先に照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/media.ts check
      # --strict は、動画かポスターの無いレクチャーがあれば止まる。組み立ての最後に、公開物の決まり（scripts/site-invariants.ts）も確かめる
      - name: 静的サイトを検証して組み立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/build_site.ts --strict
          bun scripts/check_delivery.ts site/dist
