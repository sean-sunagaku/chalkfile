# 前の形の公開（組み立てから公開までを 1 つのジョブで流す）。main への push での公開は ci.yml の deploy のジョブに移した。
# 移したあとも 1 週間は、ci.yml の公開が止まったときに手で出せるよう、手で流すとき（workflow_dispatch・main を選ぶ）だけ残す。
# 2026-11-10 に消す（ci.yml の deploy が main で緑に通ったのを確かめてから。消すときは docs/operations/recovery.md の
# 「前の形の公開で出す」も消す）。ci.yml の公開と同じ concurrency の group で、同じ時に 2 つは流れない
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalkfile-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'sean-sunagaku/chalkfile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://chalkfile.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # package.json に packageManager を書くと npm のキャッシュが自動で入る。キャッシュは鍵と範囲を決めてから足すので、今は入れない
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # secret を持つジョブなので、ほかの実行が書いたキャッシュ（bun の実行ファイル）を戻さない
          no-cache: true
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: bun scripts/check_content.ts --self-test
      - run: bun scripts/check_content.ts
      - name: 素材の可逆音声を復元するffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: 素材と講義データ
        run: |
          bun scripts/materials.ts pull
          bun scripts/synth.ts --cached-only
      - name: 動画を先に照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/media.ts check
      # Worker の許可リスト（Git に入れない生成物）を、講座ごとの動画の一覧から作る。wrangler がまとめる前に、secret の無い手順で
      - name: Worker の許可リストを作る
        run: bun scripts/gen.ts --media
      - name: 静的サイトを検証して組み立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/build_site.ts --strict
          bun scripts/check_delivery.ts site/dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'production の Cloudflare secret / vars が未設定です。値は表示しません。' >&2
            exit 1
          fi
          npx --no-install wrangler deploy --env=""
      - name: 公開後の全動画 Range 確認
        run: bun scripts/verify_public.ts
